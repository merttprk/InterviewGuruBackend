# Backend CI — Functions derlemesi ve testler. Deploy YAPILMAZ (secret'lar ve onay kullanıcıda).
name: Functions

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: İçerik doğrulama (dersler/keşfet JSON)
        working-directory: scripts/content-build
        run: node validate.js
